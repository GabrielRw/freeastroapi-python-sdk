name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets maintainers run CI on the bot-opened spec-sync/auto branch (pull requests opened
  # with GITHUB_TOKEN do not trigger workflows): Actions -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate.py --check
      - run: ruff check .
      - run: mypy
      # Unit and generator tests; contract and live tests skip without PRISM_URL / API key.
      - run: pytest
      - run: python -m build

  contract:
    # Every SDK method against a Stoplight Prism mock of spec/freeastro.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python -m pip install -e ".[dev]"
      - name: Spec tool tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Contract tests
        run: python scripts/with_prism.py -- pytest -m contract
      - name: Prism log
        if: failure()
        run: tail -n 300 prism.log || true
