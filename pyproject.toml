[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freeastroapi"
version = "0.1.0"
description = "Official Python SDK for FreeAstroAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "FreeAstroAPI" }]
keywords = ["astrology", "api", "sdk", "python", "freeastroapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.urls]
Documentation = "https://www.freeastroapi.com/docs/utilities/sdk"
Homepage = "https://www.freeastroapi.com"
Issues = "https://github.com/GabrielRw/freeastroapi-python-sdk/issues"
Source = "https://github.com/GabrielRw/freeastroapi-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/freeastroapi"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["freeastroapi"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
